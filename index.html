
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Event AR Experience</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
      background: #101412;
      color: #fff;
    }

    #instructions {
      position: fixed;
      z-index: 10;
      top: max(18px, env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px;
      background: rgba(20,25,23,.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }

    #instructions::before {
      content: "AR EXPERIENCE";
      display: block;
      margin-bottom: 5px;
      color: #78e0b2;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    #info {
      display: none;
      position: fixed;
      z-index: 20;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 14px;
      right: 14px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(24,29,27,.97);
      color: #fff;
      box-shadow: 0 12px 48px rgba(0,0,0,.35);
    }

    #info .eyebrow {
      margin-bottom: 10px;
      color: #78e0b2;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    #info h2 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.2;
    }

    #info p {
      margin: 0 0 20px;
      color: #d0d8d3;
      font-size: 16px;
      line-height: 1.55;
    }

    #info button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #a8f0ce;
      color: #14251d;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    #info button:active {
      opacity: .8;
    }
  </style>
</head>

<body>
  <div id="instructions">
    <strong>Explore the experience</strong>
    <div style="margin-top:5px;color:#d0d8d3;font-size:14px;">
      Point your camera at one of the event visuals to begin.
      Then tap a 3D country to discover more.
    </div>
  </div>

  <div id="info" role="dialog" aria-modal="false"
       aria-labelledby="infoTitle">
    <div class="eyebrow">DISCOVER MORE</div>
    <h2 id="infoTitle">Discover this country</h2>
    <p id="infoText">Explore its story.</p>
    <button id="closeInfo">Continue exploring</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 1000"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .clickable; far: 1000">
    </a-camera>

    <!-- First printed image: Belgium -->
    <a-entity mindar-image-target="targetIndex: 0" id="belgiumTarget">
      <a-gltf-model
        id="belgiumModel"
        class="clickable"
        data-country="belgium"
        src="./assets/scene.glb"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

    <!-- Second printed image: France -->
    <a-entity mindar-image-target="targetIndex: 1" id="franceTarget">
      <a-gltf-model
        id="franceModel"
        class="clickable"
        data-country="france"
        src="./assets/EESRFAudit2.glb"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.2 0.2 0.2">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const info = document.getElementById("info");
    const infoTitle = document.getElementById("infoTitle");
    const infoText = document.getElementById("infoText");

    const countries = {
      belgium: {
        name: "Belgium",
        description:
          "Capital: Brussels. Discover Belgium's culture, heritage and role at the heart of Europe."
      },

      france: {
        name: "France",
        description:
          "Capital: Paris. Explore France's regions, cultural heritage and European connections."
      }
    };

    // Open the relevant country card when its model is tapped.
    document.querySelectorAll(".clickable").forEach((model) => {
      model.addEventListener("click", () => {
        const country = countries[model.dataset.country];
        if (!country) return;

        infoTitle.textContent = country.name;
        infoText.textContent = country.description;
        info.style.display = "block";
      });
    });

    // Close the information card.
    document.getElementById("closeInfo").addEventListener("click", () => {
      info.style.display = "none";
    });

    // Animate each model when its corresponding image is detected.
    function addEntranceAnimation(targetId, modelId, finalScale) {
      const target = document.getElementById(targetId);
      const model = document.getElementById(modelId);

      target.addEventListener("targetFound", () => {
        // Don't animate before the GLB has loaded.
        if (!model.getObject3D("mesh")) return;

        model.removeAttribute("animation__enter");
        model.setAttribute("scale", "0.001 0.001 0.001");

        model.setAttribute("animation__enter", {
          property: "scale",
          from: "0.001 0.001 0.001",
          to: finalScale,
          dur: 650,
          easing: "easeOutCubic",
          startEvents: "ar-enter"
        });

        model.emit("ar-enter");
      });
    }

    addEntranceAnimation("belgiumTarget", "belgiumModel", "1 1 1");
    addEntranceAnimation("franceTarget", "franceModel", "0.2 0.2 0.2");
  </script>
</body>
</html>
