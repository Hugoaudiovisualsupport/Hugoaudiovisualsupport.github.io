<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Event AR Prototype</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        Arial, sans-serif;
      background: #101412;
      color: #fff;
    }
    
    #instructions {
      position: fixed;
      z-index: 10;
      top: max(18px, env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      background: rgba(20, 25, 23, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: left;
      pointer-events: auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }
    
    #instructions::before {
      content: "AR EXPERIENCE";
      display: block;
      margin-bottom: 5px;
      color: #78e0b2;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    
    #info {
      display: none;
      position: fixed;
      z-index: 20;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 14px;
      right: 14px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(24, 29, 27, 0.96);
      color: #fff;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
    }
    
    #info h2 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
    }
    
    #info p {
      margin: 0 0 20px;
      color: #d0d8d3;
      font-size: 16px;
      line-height: 1.55;
    }
    
    #info button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #a8f0ce;
      color: #14251d;
      font-size: 16px;
      font-weight: 700;
    }
    
    #info button:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div id="instructions">
    <strong>Explore the experience</strong>
    <div style="margin-top: 5px; color: #d0d8d3; font-size: 14px;">
      Point your camera at one of the event visuals to begin.
    </div>
  </div>
  
  <div id="info">
    <div style="color: #78e0b2; font-size: 10px;
                font-weight: 700; letter-spacing: 2px;">
      DISCOVER MORE
    </div>
  
    <h2 id="infoTitle">Discover this installation</h2>
  
    <p id="infoText">
      Explore the story behind this object.
    </p>
  
    <button id="closeInfo">Continue exploring</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 1000"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    

    
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .clickable; far: 1000">
    </a-camera>



      <!-- First printed image -->
      <a-entity mindar-image-target="targetIndex: 0">
      
        <a-gltf-model
          class="clickable"
          data-country="belgium"
          src="./assets/scene.glb"
          position="0 0 0.1"
          rotation="0 0 0"
          scale="1 1 1">
        </a-gltf-model>
      
      </a-entity>
      
      <!-- Second printed image -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model
          class="clickable"
          data-country="france"
          src="./assets/EESRFAudit2.glb"
          position="0 0 0.1"
          rotation="0 0 0"
          scale="0.2 0.2 0.2">
        </a-gltf-model>
      </a-entity>

      <!-- A visible test hotspot -->
      <a-sphere
        position="0.35 0.15 0.2"
        radius="0.045"
        color="#00D6A0"
        material="shader: flat">
      </a-sphere>

    </a-entity>
  </a-scene>

  <script>
    const info = document.getElementById("info");
    const infoTitle = document.getElementById("infoTitle");
    const infoText = document.getElementById("infoText");
    const instructions = document.getElementById("instructions");
    
    const countries = {
      belgium: {
        name: "Belgium",
        description:
          "Capital: Brussels. Explore Belgium's culture, heritage and role at the heart of Europe."
      },
    
      france: {
        name: "France",
        description:
          "Capital: Paris. Discover France's regions, cultural heritage and European connections."
      }
    };
    
    // Show the correct information when a 3D model is tapped.
    document.querySelectorAll(".clickable").forEach((model) => {
      model.addEventListener("click", () => {
        const country = countries[model.dataset.country];
    
        if (!country) return;
    
        infoTitle.textContent = country.name;
        infoText.textContent = country.description;
        info.style.display = "block";
      });
    });
    
    // Close the information panel.
    document.getElementById("closeInfo").addEventListener("click", () => {
      info.style.display = "none";
    });
    
    // Keep the banner as a temporary way to test the panel.
    instructions.addEventListener("click", () => {
      infoTitle.textContent = "Discover this installation";
      infoText.textContent =
        "Tap a 3D object to explore its country.";
      info.style.display = "block";
    });
  </script>
</body>
</html>
